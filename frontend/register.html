<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - AlpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">AlpTrack</a>
    </div>
</nav>

<div class="auth-form">
    <div class="card">
        <div class="card-body">
            <h3 class="text-center mb-4">Регистрация</h3>
            
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="username" required minlength="3">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label">Уровень подготовки (1-5)</label>
                    <select class="form-select" id="experience_level">
                        <option value="1">1 - Новичок</option>
                        <option value="2">2 - Начинающий</option>
                        <option value="3" selected>3 - Средний</option>
                        <option value="4">4 - Опытный</option>
                        <option value="5">5 - Эксперт</option>
                    </select>
                </div>
                
                <div id="error" class="error-message"></div>
                
                <button type="submit" class="btn btn-primary w-100 mt-3">Зарегистрироваться</button>
            </form>
            
            <p class="text-center mt-3">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
