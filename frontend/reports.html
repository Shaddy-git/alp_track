<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчёты - AlpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">AlpTrack</a>
        <div class="d-flex gap-3 align-items-center">
            <a href="dashboard.html" class="text-decoration-none">Кабинет</a>
            <a href="mountains.html" class="text-decoration-none">Горы</a>
            <a href="reports.html" class="text-decoration-none fw-bold">Отчёты</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Выйти</button>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Отчёты</h2>
    
    <div class="row g-4">
        <!-- Топ гор -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Топ гор по восхождениям</h5>
                    <div id="popularMountains">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Статистика за год -->
        <div class="col-lg-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Статистика за год</h5>
                    <div class="mb-3">
                        <label class="form-label">Выберите год</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="yearInput" value="2026" min="2000" max="2100">
                            <button class="btn btn-primary" onclick="loadYearStats()">Показать</button>
                        </div>
                    </div>
                    <div id="yearStats">
                        <p class="text-muted">Нажмите «Показать»</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Покорители горы -->
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-3">Покорители горы</h5>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Выберите гору</label>
                            <select class="form-select" id="mountainSelect">
                                <option value="">- Загрузка гор -</option>
                            </select>
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <button class="btn btn-primary" onclick="loadClimbers()">Показать альпинистов</button>
                        </div>
                    </div>
                    <div id="climbersResult">
                        <p class="text-muted">Выберите гору и нажмите «Показать»</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
