<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет - AlpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">AlpTrack</a>
        <div class="d-flex gap-3 align-items-center">
            <a href="dashboard.html" class="text-decoration-none">Кабинет</a>
            <a href="mountains.html" class="text-decoration-none">Горы</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Выйти</button>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Личный кабинет</h2>
    <!-- Блок отчётов для admin/instructor -->
    <div id="reportsCard" class="card mb-4" style="display:none;">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="card-title mb-1">Отчёты и статистика</h5>
                <p class="text-muted mb-0">Аналитика по восхождениям, топ гор, покорители вершин</p>
            </div>
            <a href="reports.html" class="btn btn-primary">Открыть отчёты →</a>
        </div>
    </div>
    
    <div class="row g-4">
        <!-- Профиль -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Ваш профиль</h5>
                    <ul class="list-unstyled mt-3" id="profileInfo">
                        <li>Загрузка...</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Мои восхождения -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Мои восхождения</h5>
                    <div id="ascentsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row g-4 mt-1">
        <!-- Группы -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Группы восхождений</h5>
                    <div id="groupsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Доступные горы -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Доступные горы</h5>
                    <div id="mountainsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
