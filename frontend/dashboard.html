<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет - AlpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">AlpTrack</a>
        <div>
            <span id="userInfo" class="me-3 text-muted"></span>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Выйти</button>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Личный кабинет</h2>
    
    <div class="row g-4">
        <!-- Профиль -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Ваш профиль</h5>
                    <ul class="list-unstyled mt-3" id="profileInfo">
                        <li>Загрузка...</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- Мои восхождения -->
        <div class="col-md-8">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Мои восхождения</h5>
                    <div id="ascentsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row g-4 mt-1">
        <!-- Группы -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Группы восхождений</h5>
                    <div id="groupsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Доступные горы -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Доступные горы</h5>
                    <div id="mountainsList" class="mt-3">
                        <p class="text-muted">Загрузка...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
