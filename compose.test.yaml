services:

  test-db:
    image: postgres:17.11-bookworm
    container_name: alp-track-test-db
    restart: "no"

    env_file:
      - /etc/alp_track_docker/test-postgres.env

    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - /etc/alp_track_docker/02-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro

    networks:
      - alp_track_test_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

    security_opt:
      - no-new-privileges:true

  test-runner:
    image: alp-track-test:0.1.0

    build:
      context: .
      dockerfile: Dockerfile.test

    restart: "no"

    env_file:
      - /etc/alp_track_docker/test-app.env

    depends_on:
      test-db:
        condition: service_healthy

    networks:
      - alp_track_test_net

    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128

    security_opt:
      - no-new-privileges:true

volumes:
  test_postgres_data:
    name: alp_track_test_pgdata

networks:
  alp_track_test_net:
    name: alp_track_test_net
    driver: bridge
