services:

  db:
    image: postgres:17.11-bookworm
    container_name: alp-track-db
    restart: unless-stopped

    env_file:
      - /etc/alp_track_docker/postgres.env

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/alp_track_docker/01-create-app-user.sql:/docker-entrypoint-initdb.d/01-create-app-user.sql:ro

    networks:
      - alp_track_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

    security_opt:
      - no-new-privileges:true

  app:
    image: alp-track-app:0.1.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alp-track-app
    restart: unless-stopped
    init: true

    env_file:
      - /etc/alp_track_docker/app.env

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - alp_track_net

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    stop_grace_period: 30s

    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128

    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: alp_track_pgdata

networks:
  alp_track_net:
    name: alp_track_net
    driver: bridge
